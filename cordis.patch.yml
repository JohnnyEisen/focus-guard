# focus-guard 的 DSH bundle 补丁（v2.5.0 起改为空载）
#
# 自 2.5.0 起，DSH 端不再通过本 bundle 自动挂载 fire-and-forget 事件钩子（监察模式），
# 改为官方硬拦截通道：在 profile 的 cordis.patch.yml 挂载 @deepseek-ai/dsh-hooks-claude-code 桥，
# 由桥直接运行本仓库 hooks/hooks.json（Claude 方言）——exit 2 硬拦截、审批单 demand 模型可见、
# Stop 打回强制续步。部署步骤见仓库 INSTALL.md「二、DSH 安装」。
#
# 保持 bundle 为空载的原因：若 bundle 的事件钩子与桥同时挂载，同一事件会双跑（监察 + 硬拦截各一次）。
# 如确需并存（例如桥不可用时的观察期），请自行在本文件加回事件映射，映射表见 git 历史 v2.4.1 版本。
